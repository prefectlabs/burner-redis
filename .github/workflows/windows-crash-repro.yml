name: Windows crash repro

# Reproduce the native interpreter crash that led FastMCP to pin
# burner-redis<0.1.7 on Windows (PrefectHQ/fastmcp#4618). The published
# 0.1.7 wheel was built with Rust 1.95.0 and the 0.1.6 wheel with 1.94.1,
# with identical crate versions, so the matrix isolates the compiler and
# the workload. The docket-windows workflow never covered this shape: it
# builds from source and strips pytest-xdist from docket's addopts.

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHONFAULTHANDLER: "1"

jobs:
  docket-suite:
    name: docket, ${{ matrix.install.label }}, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        install:
          # The published wheel users get (built with Rust 1.95.0).
          - { label: "wheel 0.1.7", kind: wheel, spec: "burner-redis==0.1.7" }
          # The same code built with each compiler, to isolate the toolchain.
          # 0.1.6's wheel is not a valid control here: docket main needs the
          # 0.1.7 Lua stream commands.
          - { label: "source rust 1.94.1", kind: source, rust: "1.94.1" }
          - { label: "source rust 1.95.0", kind: source, rust: "1.95.0" }
    steps:
      - name: Checkout burner-redis
        uses: actions/checkout@v6
        with:
          path: burner-redis

      - name: Checkout docket
        uses: actions/checkout@v6
        with:
          repository: chrisguidry/docket
          ref: main
          path: docket

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust ${{ matrix.install.rust }}
        if: matrix.install.kind == 'source'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.install.rust }}

      - name: Enable WER crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\crashdumps" | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$env:GITHUB_WORKSPACE\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 16 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f

      - name: Point docket at the source tree
        if: matrix.install.kind == 'source'
        shell: bash
        working-directory: docket
        run: |
          cat >> pyproject.toml <<'EOF'

          [tool.uv.sources]
          burner-redis = { path = "../burner-redis" }
          EOF

      - name: Install docket dependencies
        working-directory: docket
        run: uv sync --upgrade-package 'redis>=5'

      - name: Force the published wheel
        if: matrix.install.kind == 'wheel'
        working-directory: docket
        run: uv pip install "${{ matrix.install.spec }}"

      - name: Show resolved versions
        shell: bash
        working-directory: docket
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; print('burner-redis', m.version('burner-redis'))"
          uv run --no-sync python -c "import burner_redis; print('loaded from', burner_redis.__file__)"

      - name: Run the docket suite under pytest-xdist, 3 rounds
        env:
          REDIS_VERSION: memory
        shell: bash
        working-directory: docket
        run: |
          for round in 1 2 3; do
            echo "=== round $round ==="
            uv run --no-sync pytest --ignore=tests/cli \
              --import-mode=importlib \
              -o addopts= -q -n logical --timeout=120
          done

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashdumps-docket-py${{ matrix.python-version }}-${{ strategy.job-index }}
          path: crashdumps/*.dmp
          if-no-files-found: ignore

  fastmcp-tasks:
    name: fastmcp, ${{ matrix.pair.label }}, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        pair:
          # What Windows users get today under the pin: expected clean.
          - { label: "pinned (pydocket 0.20.1 + burner 0.1.6)", force: "" }
          # The combination the pin blocks: the reported crasher.
          - {
              label: "pydocket 0.24.1 + burner 0.1.7",
              force: "pydocket==0.24.1 burner-redis==0.1.7",
            }
    steps:
      - name: Checkout fastmcp
        uses: actions/checkout@v6
        with:
          repository: PrefectHQ/fastmcp
          ref: main
          path: fastmcp

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Enable WER crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\crashdumps" | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$env:GITHUB_WORKSPACE\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 16 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f

      - name: Install fastmcp dependencies
        working-directory: fastmcp
        run: uv sync

      - name: Force the crashing pair
        if: matrix.pair.force != ''
        working-directory: fastmcp
        run: uv pip install ${{ matrix.pair.force }}

      - name: Show resolved versions
        shell: bash
        working-directory: fastmcp
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; print('pydocket', m.version('pydocket')); print('burner-redis', m.version('burner-redis'))"

      - name: Run the fastmcp tasks suite under pytest-xdist, 3 rounds
        shell: bash
        working-directory: fastmcp
        run: |
          for round in 1 2 3; do
            echo "=== round $round ==="
            uv run --no-sync pytest tests/tasks -q -n logical
          done

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashdumps-fastmcp-py${{ matrix.python-version }}-${{ strategy.job-index }}
          path: crashdumps/*.dmp
          if-no-files-found: ignore
