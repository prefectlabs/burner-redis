name: Docket test suite (Windows)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docket-memory-windows:
    name: Docket, Windows, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout burner-redis
        uses: actions/checkout@v6
        with:
          path: burner-redis

      - name: Checkout docket
        uses: actions/checkout@v6
        with:
          repository: chrisguidry/docket
          ref: main
          path: docket

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Override docket's burner-redis dependency
        shell: bash
        working-directory: docket
        run: |
          cat >> pyproject.toml <<'EOF'

          [tool.uv.sources]
          burner-redis = { path = "../burner-redis" }
          EOF

      - name: Install docket dependencies
        working-directory: docket
        run: uv sync --upgrade-package 'redis>=5'

      # A crashed pytest-xdist worker discards its own stdout, so a native
      # fault would otherwise leave no evidence. WER writes a minidump we
      # can upload instead.
      - name: Enable WER crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\crashdumps" | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$env:GITHUB_WORKSPACE\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 16 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f

      # -n logical matches how docket and fastmcp run this suite for real;
      # a single-process run cannot see multi-worker teardown problems.
      - name: Run tests
        env:
          REDIS_VERSION: memory
        working-directory: docket
        run: >
          uv run pytest --ignore=tests/cli
          --import-mode=importlib
          -o 'addopts='
          -v
          -n logical
          --timeout=120

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashdumps-py${{ matrix.python-version }}
          path: crashdumps/*.dmp
          if-no-files-found: ignore
